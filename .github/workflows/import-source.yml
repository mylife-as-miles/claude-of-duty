name: Import Claude of Duty

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-source.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source repository
        run: git clone --bare https://github.com/mshumer/Claude-of-Duty.git source.git

      - name: Replace destination main with source main
        working-directory: source.git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push destination refs/heads/main:refs/heads/main --force
          git push destination --tags --force
