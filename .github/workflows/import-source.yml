name: Import Claude of Duty

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-source.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and import source repository
        id: import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/import.log"
          : > "$LOG"

          echo "Cloning source repository..." >> "$LOG"
          git clone --bare https://github.com/mshumer/Claude-of-Duty.git source.git >> "$LOG" 2>&1
          STATUS=$?

          if [ "$STATUS" -eq 0 ]; then
            cd source.git
            git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" >> "$LOG" 2>&1
            echo "Pushing source main to destination main..." >> "$LOG"
            git push destination refs/heads/main:refs/heads/main --force >> "$LOG" 2>&1
            STATUS=$?

            if [ "$STATUS" -eq 0 ]; then
              git push destination --tags --force >> "$LOG" 2>&1
              STATUS=$?
            fi
          fi

          echo "exit_code=$STATUS" >> "$LOG"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-diagnostics
          path: ${{ runner.temp }}/import.log

      - name: Confirm import succeeded
        if: always()
        run: test "${{ steps.import.outputs.status }}" = "0"
